<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="./lib/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>
</head>
<body>
  <div id="app">加载中</div>

  <script>
    window.$docsify = {
      name: 'learn-note',
      repo: 'https://github.com/HanasakiHonoka/learn-note',
      auto2top: true,
	    loadSidebar: true,
      // Mermaid 在浏览器内渲染；加载失败时保留原始代码块。
    plugins: [function (hook) {
      hook.doneEach(function () {
        if (!window.mermaid) return;
        var blocks = document.querySelectorAll('pre[data-lang="mermaid"]');
        blocks.forEach(function (block) {
          var code = block.querySelector('code');
          if (!code) return;
          var diagram = document.createElement('div');
          diagram.className = 'mermaid';
          diagram.textContent = code.textContent;
          block.parentNode.replaceChild(diagram, block);
        });
        window.mermaid.init(undefined, document.querySelectorAll('.mermaid'));
      });
    }],
      subMaxLevel: 3

    }
  </script>
  <!-- 固定版本以避免渲染接口变更；离线时仍显示 Mermaid 源码 -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>
  <script>if (window.mermaid) window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });</script>
  <!-- Docsify v4 -->

  <!-- <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script> -->
  <script src="./lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <!-- 复制到剪贴板 -->
  <script src="//unpkg.com/docsify-copy-code"></script>
  <!-- 表情 -->
  <script src="//unpkg.com/docsify/lib/plugins/emoji.js"></script>
  <!-- 字数统计 -->
  <script src="//unpkg.com/docsify-count/dist/countable.js"></script>
</body>
</html>
